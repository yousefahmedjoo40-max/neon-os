body{margin:0;font-family:Inter,"Segoe UI",system-ui,-apple-system,"Noto Sans","Noto Sans Arabic","Noto Sans SC","Noto Sans JP","Noto Sans Devanagari",sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3)) fixed;min-height:100vh;line-height:1.6;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(600px 400px at 15% 10%,rgba(140,70,255,.28),transparent 70%),radial-gradient(700px 500px at 90% 80%,rgba(255,60,200,.2),transparent 70%),radial-gradient(500px 400px at 60% 20%,rgba(0,229,255,.16),transparent 70%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:20px 22px 60px}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 28px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;letter-spacing:.5px}
.brand img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 22px rgba(0,229,255,.55)}
.brand b{color:var(--cy);text-shadow:0 0 16px rgba(0,229,255,.8)}
select{background:var(--card);color:var(--tx);border:1px solid rgba(0,229,255,.3);border-radius:12px;padding:9px 14px;font:inherit;cursor:pointer;max-width:48vw}
select:focus{outline:2px solid var(--cy)}
select option{background:#120a32;color:#fff}
.hero{text-align:center;padding:30px 0 20px}
.hero img.logo{width:150px;height:150px;border-radius:50%;animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 22px rgba(0,229,255,.35)}to{box-shadow:0 0 60px rgba(176,92,255,.8)}}
h1{font-size:clamp(40px,8vw,72px);margin:18px 0 6px;letter-spacing:2px}
h1 span{background:linear-gradient(120deg,var(--cy),var(--vi),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:clamp(17px,2.6vw,22px);opacity:.85;max-width:640px;margin:0 auto 30px}
.btn{display:inline-block;background:linear-gradient(120deg,var(--cy),var(--vi));color:#07021a;font-weight:800;font-size:20px;padding:16px 44px;border-radius:18px;text-decoration:none;transition:transform .2s,box-shadow .2s;box-shadow:0 0 30px rgba(0,229,255,.45)}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 0 46px rgba(0,229,255,.85)}
.sub{opacity:.65;font-size:14px;margin-top:14px}
h2{font-size:28px;margin:60px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:22px;transition:all .25s}
.card:hover{border-color:var(--cy);box-shadow:0 0 26px rgba(0,229,255,.28);transform:translateY(-3px)}
.card .ic{font-size:30px}
.card h3{margin:8px 0 4px;font-size:19px}
.card p{margin:0;opacity:.75;font-size:15px}
ol{padding-inline-start:22px}
ol li{margin:10px 0;font-size:17px}
code{background:rgba(255,255,255,.1);padding:2px 8px;border-radius:8px;direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.shots img{width:100%;border-radius:18px;border:1px solid rgba(0,229,255,.3);box-shadow:0 0 30px rgba(140,70,255,.3)}
footer{margin-top:60px;opacity:.6;text-align:center;font-size:14px}
</style>
</head>

};
const RTL = ["ar"];
const sel = document.getElementById("lang");
for (const k in T) { const o = document.createElement("option"); o.value = k; o.textContent = T[k].n; sel.appendChild(o); }
function setLang(code) {
  if (!T[code]) code = "en";
  const d = T[code];
  document.documentElement.lang = code;
  document.documentElement.dir = RTL.includes(code) ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(el => { const v = d[el.dataset.i]; if (v !== undefined) el.textContent = v; });
  document.title = "NeonOS — " + d.dl;
  sel.value = code;
  try { localStorage.setItem("neon-lang", code); } catch (e) {}
}
let saved = null;
try { saved = localStorage.getItem("neon-lang"); } catch (e) {}
const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
setLang(saved || (T[nav] ? nav : "en"));
sel.addEventListener("change", () => setLang(sel.value));

// رابط الإيزو المباشر من أحدث إصدار على GitHub
fetch("https://api.github.com/repos/yousefahmedjoo40-max/nova-os/releases/latest")
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(rel => {
    const iso = (rel.assets || []).find(a => /\.iso$/i.test(a.name));
    if (iso) {
      document.getElementById("dl").href = iso.browser_download_url;
      document.getElementById("ver").textContent = rel.tag_name + " · " + (iso.size / 1073741824).toFixed(2) + " GB";
    } else if ((rel.assets || []).length) {
      document.getElementById("ver").textContent = rel.tag_name;
    }
  })
  .catch(() => {});
</script>
